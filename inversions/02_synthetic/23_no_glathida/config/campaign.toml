[campaign]
name = "23_no_glathida"
results_dir = "outputs/results"

[run]
epochs_adam = 20
epochs_linesearch = 30

# TODO: fill in the RGI ID of the glacier that has no real GlaThiDa coverage.
rgi_ids = [
    "RGI60-11.03676",
]


[model]
invert_target = "A"
law_A = "TemperateA"

[simulation]
tspan = [2010.0, 2011.0]
spinup = true
spinup_tspan = [2009.0, 2010.0]
step = 0.04166667 # 1/24
step_gt = 1.0

# This glacier has no real GlaThiDa coverage: skip fetching it (it would
# otherwise error out with "None of the provided RGI IDs have GlaThiDa"),
# and fake a sparse point-like H mask for S7 by reusing the V sparsity mask
# generator (Sleipnir.random_spatially_coherent_mask) with a much higher
# threshold than V's (0.02) so far less of the footprint stays "observed" -
# calibrated empirically to ~3-4% visible on a typical alpine footprint,
# vs. V's ~50%. Tune fake_glathida_threshold up/down to taste.
use_glathida_data = false
fake_glathida_sigma = 0.7
fake_glathida_threshold = 0.5
